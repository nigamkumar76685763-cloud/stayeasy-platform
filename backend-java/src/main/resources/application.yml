server:
  port: 5000

spring:
  application:
    name: stayeasy-backend
  datasource:
    url: jdbc:h2:mem:stayeasydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

app:
  jwt:
    secret: StayEasySuperSecretLuxuryPlatformKey2026SecureKeyWith256BitsMinimumLength!
    expiration-ms: 86400000 # 24 Hours
